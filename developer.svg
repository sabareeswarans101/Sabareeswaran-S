<svg viewBox="0 0 420 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b2e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2340"/>
      <stop offset="100%" stop-color="#12172b"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="420" height="420" rx="20" fill="url(#bg)"/>
  <ellipse cx="210" cy="90" rx="160" ry="90" fill="url(#glow)"/>

  <!-- floating code symbols -->
  <g font-family="Menlo, Consolas, monospace" font-size="18" fill="#5ac8fa" opacity="0.8">
    <text x="55" y="70">&lt;/&gt;
      <animate attributeName="y" values="70;58;70" dur="3.4s" repeatCount="indefinite"/>
    </text>
    <text x="330" y="95" fill="#a78bfa">{ }
      <animate attributeName="y" values="95;83;95" dur="3s" repeatCount="indefinite"/>
    </text>
    <text x="300" y="150" fill="#4ade80" font-size="14">01
      <animate attributeName="y" values="150;140;150" dur="2.6s" repeatCount="indefinite"/>
    </text>
    <text x="70" y="150" fill="#f472b6" font-size="14">#!
      <animate attributeName="y" values="150;162;150" dur="3.8s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- desk -->
  <rect x="40" y="330" width="340" height="14" rx="4" fill="#232a3f"/>
  <rect x="60" y="344" width="14" height="46" fill="#1a2033"/>
  <rect x="346" y="344" width="14" height="46" fill="#1a2033"/>

  <!-- monitor -->
  <rect x="150" y="210" width="120" height="82" rx="6" fill="url(#screenGrad)" stroke="#2f3a5c" stroke-width="2"/>
  <rect x="200" y="292" width="20" height="16" fill="#232a3f"/>
  <rect x="184" y="308" width="52" height="6" rx="3" fill="#232a3f"/>

  <!-- code lines on monitor -->
  <g fill="#5ac8fa">
    <rect x="162" y="224" width="46" height="5" rx="2"/>
    <rect x="162" y="236" width="70" height="5" rx="2" fill="#a78bfa"/>
    <rect x="162" y="248" width="34" height="5" rx="2" fill="#4ade80"/>
    <rect x="162" y="260" width="58" height="5" rx="2"/>
    <rect x="162" y="272" width="24" height="5" rx="2" fill="#f472b6">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- chair -->
  <rect x="196" y="238" width="10" height="70" rx="4" fill="#2a3350"/>

  <!-- person: seated silhouette -->
  <g>
    <!-- body -->
    <path d="M170 330 L172 275 Q172 258 198 256 L222 256 Q248 258 248 275 L250 330 Z" fill="#2b3555"/>
    <!-- head -->
    <circle cx="210" cy="230" r="22" fill="#3a4570"/>
    <!-- neck -->
    <rect x="203" y="248" width="14" height="12" fill="#2b3555"/>
    <!-- arms reaching to laptop -->
    <path d="M182 278 Q160 288 158 310" stroke="#2b3555" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M238 278 Q262 288 264 310" stroke="#2b3555" stroke-width="12" fill="none" stroke-linecap="round"/>
  </g>

  <!-- laptop on desk -->
  <g>
    <rect x="150" y="308" width="120" height="6" rx="2" fill="#1a2033"/>
    <path d="M150 308 L160 262 L260 262 L270 308 Z" fill="url(#screenGrad)" stroke="#2f3a5c" stroke-width="2"/>
    <rect x="170" y="272" width="80" height="4" rx="2" fill="#5ac8fa"/>
    <rect x="170" y="280" width="56" height="4" rx="2" fill="#a78bfa"/>
    <rect x="170" y="288" width="68" height="4" rx="2" fill="#4ade80"/>
    <rect x="170" y="296" width="20" height="4" rx="2" fill="#f472b6">
      <animate attributeName="opacity" values="1;0.15;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- coffee cup -->
  <g>
    <rect x="300" y="300" width="20" height="18" rx="3" fill="#3a4570"/>
    <path d="M320 304 q10 0 10 7 q0 7 -10 7" fill="none" stroke="#3a4570" stroke-width="3"/>
    <path d="M305 296 q2 -8 0 -14" stroke="#8892b0" stroke-width="2" fill="none" opacity="0.7">
      <animate attributeName="d" values="M305 296 q2 -8 0 -14; M305 296 q-2 -8 0 -14; M305 296 q2 -8 0 -14" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M312 296 q2 -8 0 -14" stroke="#8892b0" stroke-width="2" fill="none" opacity="0.6">
      <animate attributeName="d" values="M312 296 q-2 -8 0 -14; M312 296 q2 -8 0 -14; M312 296 q-2 -8 0 -14" dur="2.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- plant -->
  <g>
    <rect x="90" y="304" width="18" height="16" rx="2" fill="#3a4570"/>
    <path d="M99 304 q-10 -14 -18 -12" stroke="#4ade80" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M99 304 q0 -18 8 -22" stroke="#4ade80" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M99 304 q10 -12 16 -8" stroke="#4ade80" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
</svg>
